# Read the Docs configuration file
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/source/conf.py
  # warnings do not fail the build: the inventories of other projects (intersphinx) are sometimes
  # unreachable; the build itself is checked by the docs job of .github/workflows/ci.yml
  fail_on_warning: false

# HTML and PDF
formats:
  - pdf

# The package is installed with its "docs" extra (pyproject.toml); the notebooks are rendered with
# their stored outputs (they need the complete look-up table and external data).
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
